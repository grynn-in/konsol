{% extends "templates/web.html" %}
{% block title %}Konsol Exec{% endblock %}
{% block style %}
<link rel="stylesheet" href="/assets/konsol/konsol_exec/konsol_exec.css?v={{ css_version }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .navbar, .web-footer, footer, .page-header { display: none !important; }
  .page-content, .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
  /* dark-first console; the SPA adds html.kc-light for the light variant */
  body { background: #14171C; }
  html.kc-light body { background: #F4F2EC; }
</style>
{% endblock %}
{% block page_content %}
<script>window.csrf_token = "{{ csrf_token }}";</script>
<div id="root"></div>
<script type="module" src="/assets/konsol/konsol_exec/konsol_exec.js?v={{ js_version }}"></script>
{% endblock %}
