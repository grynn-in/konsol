{% extends "templates/web.html" %}
{% block title %}Konsol Exec{% endblock %}
{% block style %}
<link rel="stylesheet" href="/assets/konsol/konsol_exec/konsol_exec.css?v={{ css_version }}">
<style>
  /* The SPA owns the viewport. Fonts and colour now come from frappe-ui, which
     ships its own faces in the bundle and follows the desk's theme — so there
     are no Google Fonts to fetch and no hardcoded background to fight. */
  .navbar, .web-footer, footer, .page-header { display: none !important; }
  .page-content, .page_content, .container, main.container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
</style>
{% endblock %}
{% block page_content %}
<script>window.csrf_token = "{{ csrf_token }}";</script>
<div id="root"></div>
<script type="module" src="/assets/konsol/konsol_exec/konsol_exec.js?v={{ js_version }}"></script>
{% endblock %}
