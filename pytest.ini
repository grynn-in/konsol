# konsol's pytest configuration (scripts/run-host-tests.py runs the files the
# same way, one process per file, and passes these flags itself).
#
# The cache provider is off: a pytest run from this directory on a single file
# used to take konsol/setup.py (a konsol module, not a project setup) for the
# project root and write konsol/.pytest_cache, whose CACHEDIR.TAG has no file
# suffix and failed test_no_hardcoded_dimensions::
# test_no_shipped_text_suffix_escapes_the_scan. This file is the ini pytest
# finds first, so the rootdir is this directory, and no cache is written.
[pytest]
addopts = -p no:cacheprovider
