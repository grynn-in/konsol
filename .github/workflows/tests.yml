# konsol's first CI. Context: three host tests sat red for months unnoticed
# (#89), and the compilation error that stopped the whole dbt build reporting
# anything was found by hand — this repo had no .github at all. Both suites
# below run in seconds on a laptop; there was never a reason they should not
# run on every push.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Python host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The runner itself is stdlib-only by design. These three unlock the
      # tests that need them, and konsol#248 is why pytest is among them: CI
      # was skipping 18 files for "needs pytest" that a laptop runs, so it
      # reported 2131/2131 across 141 files while the local suite ran 159.
      # A skip is now a failure unless scripts/host-test-skips.txt declares it,
      # and declaring those 18 would have used the new gate to hide the gap it
      # exists to reveal.
      - run: pip install requests pyyaml pytest
      - name: Run host tests
        run: python3 scripts/run-host-tests.py

  close-ui-js-tests:
    name: close-ui JS tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: close-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: close-ui/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Run node --test
        run: node --test src/
